name: Upload Test Release

on:
  workflow_dispatch: # Allows manual workflow execution

jobs:
  upload_and_notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permesso tassativo per creare Release e Tag

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Aggiornato a v4 (Node 20)

      - name: Get version from update.json
        id: get_version
        run: |
          VERSION=$(jq -r .version update.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Parse dynamic changelog
        id: prep_changelog
        run: |
          # 1. Parsing chirurgico con AWK:
          # Cerca il primo header "## ", stampa tutto finché non incontra il secondo "## "
          awk '/^## /{ if (p) exit; p=1 } p' changelog.md > raw_changelog.txt

          # 2. Pulizia estetica: Rimuove "## " dalla prima riga (come in foto)
          sed 's/^## //g' raw_changelog.txt > current_changelog.txt

          # 3. Mappatura sicura multiriga per Telegram (evita escape errors)
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "CHANGELOG<<$EOF" >> $GITHUB_ENV
          cat current_changelog.txt >> $GITHUB_ENV
          echo "$EOF" >> $GITHUB_ENV

      - name: Create Magisk ZIP file
        run: |
          # Pattern Systemless nativo: creiamo la struttura PRIMA di zippare
          mkdir -p system/bin
          mv infamick system/bin/

          ZIP_NAME="Infamick-script-${{ env.VERSION }}_MAGISK_TEST.zip"
          zip -r $ZIP_NAME changelog.md common customize.sh system META-INF module.prop README.md uninstall.sh
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Create Test Pre-Release
        uses: softprops/action-gh-release@v2 # Action unificata moderna (crea release + upload asset + attach source code)
        with:
          tag_name: Test-${{ env.VERSION }}.${{ github.run_number }} # Tag univoco per evitare collisioni nei test ripetuti
          name: Prerelease ${{ env.VERSION }}
          body_path: current_changelog.txt
          prerelease: true
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Telegram (Message)
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_PRIVATE_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          disable_web_page_preview: true
          message: |
            <b>New Infamick Script ${{ env.VERSION }} (Pre-Release) Test...! 🛠️</b>    

            <b>CHANGELOG:</b>
            <pre><code>${{ env.CHANGELOG }}</code></pre>

            <b>Repository:</b> <a href="https://github.com/${{ github.repository }}">${{ github.repository }}</a>
            <b>Release:</b> <a href="https://github.com/${{ github.repository }}/releases/tag/Test-${{ env.VERSION }}.${{ github.run_number }}">View on GitHub</a>

      - name: Upload ZIP to Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_PRIVATE_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          document: ${{ env.ZIP_NAME }}
          message: "📦 ZIP Modulo di Test - Prerelease ${{ env.VERSION }}"
